<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), usb=(), serial=(), bluetooth=(), midi=(), xr-spatial-tracking=(), clipboard-read=(), clipboard-write=()" />
<title>Hobbs Sauce Map (Embed)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
html,body{margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff4e6;color:#222}
#map{width:100%;height:650px;border:0}
/* Minimal marker legend hidden by default for embed */
</style>
</head>
<body>
<div id="map" aria-label="Hobbs Sauce locations map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script>
(function sandboxBlock(){
  // Attempt to neuter potential device / local network discovery APIs inside this iframe
  const denyProps = ['bluetooth','usb','serial','hid','mediaDevices'];
  denyProps.forEach(p=>{
    try {
      if (navigator[p]) {
        Object.defineProperty(navigator,p,{ configurable:true, get: () => undefined });
      }
    } catch(e){/* ignore */}
  });
})();
(function(){
  const isInIframe = (()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  function safePost(msg){try{if(isInIframe) parent.postMessage(msg,'*');}catch(e){}}
  let map; let markers=[]; let locations=[];
  function init(){
    map = L.map('map',{zoomControl:true}).setView([39.9526,-75.1652],11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:20}).addTo(map);
    addMarkers(); fit();
  }
  function addMarkers(){ markers.forEach(m=>map.removeLayer(m)); markers=[]; locations.forEach(loc=>{ const lat=+loc.latitude, lng=+loc.longitude; if(!lat||!lng) return; const iconUrl = chooseIcon(loc.type); const icon=L.icon({iconUrl,iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-24]}); const marker=L.marker([lat,lng],{icon}); const popup=L.popup({closeButton:false,autoClose:false,closeOnClick:false}).setContent(`<div style='text-align:center;font-size:12px'><strong>${loc.name}</strong><br>${loc.address||''}${loc.phone?'<br>'+loc.phone:''}</div>`); marker.bindPopup(popup); marker.on('mouseover',()=>marker.openPopup()); marker.on('mouseout',()=>marker.closePopup()); marker.addTo(map); markers.push(marker); }); }
  function chooseIcon(type){ const t=(type||'').toLowerCase(); if(t.includes('retail')&&t.includes('menu')) return 'assets/hobbs-black.png'; if(t.includes('retail')) return 'assets/hobbs-black.png'; return 'assets/hobbs-orange.png'; }
  function fit(){ if(!markers.length) return; const g=L.featureGroup(markers); map.fitBounds(g.getBounds(),{padding:[25,25],maxZoom:12}); }
  function load(){ Papa.parse('data/hobbs_locations.csv?t='+Date.now(),{download:true,header:true,complete:r=>{locations=r.data.filter(l=>l.name&&l.latitude&&l.longitude); init(); reportHeight();},error:err=>{safePost({type:'embed-error',message:err.message});}}); }
  function reportHeight(){ setTimeout(()=>{ safePost({type:'height',height:document.documentElement.scrollHeight}); },600); }
  window.addEventListener('resize',reportHeight);
  window.addEventListener('error',e=>safePost({type:'embed-error',message:e.message}));
  load();
})();
</script>
</body>
</html>
