<div id="hobbs-map-loader">Loading Hobbs Sauce Map...</div>

<script>
// Fetch and inject the latest map HTML
fetch('https://raw.githubusercontent.com/saucemaster-web/HobbsSauce-map/main/index-squarespace-clean.html')
  .then(response => response.text())
  .then(html => {
    // Extract just the body content
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const mapContent = doc.body.innerHTML;
    const mapStyles = doc.head.innerHTML;
    
    // Inject styles into head
    document.head.insertAdjacentHTML('beforeend', mapStyles);
    
    // Replace loader with map content
    document.getElementById('hobbs-map-loader').outerHTML = mapContent;
  })
  .catch(error => {
    document.getElementById('hobbs-map-loader').innerHTML = 'Error loading map. Please refresh the page.';
  });
</script>
